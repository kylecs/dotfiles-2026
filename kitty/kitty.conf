# Kitty is just the window: Neovim does splits, tabs and terminals.
# No splits, prefix keys or ctrl+hjkl maps here, so every key reaches Neovim.

# theme (Neovim also paints the background to match whichever theme it's on)
include gruvbox-dark.conf

# font
font_family      family="IosevkaTerm Nerd Font Mono"
font_size        18.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# one window per tab; tab bar only shows if a second kitty tab is ever opened
enabled_layouts  stack
tab_bar_min_tabs 2
tab_bar_edge     bottom

window_padding_width 4
